name: Daily Job Search Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Write credentials.json from secret
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_CREDS" > credentials.json
      - name: Run tests
        env:
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: pytest tests/ -v
      - name: Run pipeline
        env:
          TARGET_ROLE: ${{ secrets.TARGET_ROLE }}
          TARGET_LOCATION: ${{ secrets.TARGET_LOCATION }}
          GREENHOUSE_COMPANIES: ${{ secrets.GREENHOUSE_COMPANIES }}
          LEVER_COMPANIES: ${{ secrets.LEVER_COMPANIES }}
          LINKEDIN_ENABLED: "false"
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_pipeline.py
